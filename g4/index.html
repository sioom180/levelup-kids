        {"lv": 3, "q": "荷花的莖（蓮藕）裡有很多孔洞，有什麼用處？", "options": ["用來儲存泥沙", "讓魚躲進去", "讓空氣送到埋在泥土裡的部分", "讓莖變得比較重"], "answer": 2, "hint": "泥土裡空氣很少，孔洞像通風管，讓空氣送到水下的部分。"},

        {"lv": 3, "q": "筊白筍是哪一類水生植物？", "options": ["挺水植物", "漂浮植物", "沉水植物", "浮葉植物"], "answer": 0, "hint": "筊白筍的根在泥土裡，莖葉高高挺出水面，是挺水植物。"},
        {"lv": 3, "q": "用水管和虹吸現象幫魚缸換水，出水口要放在哪裡？", "options": ["比魚缸的水面低", "比魚缸的水面高", "放哪裡都可以", "和魚缸的水面一樣高"], "answer": 0, "hint": "水管先裝滿水，出水口比水面低，水才會一直流出來。"},
        {"lv": 3, "q": "衛生紙和塑膠片的一角都泡進有顏色的水，過一會兒會怎樣？", "options": ["只有塑膠片會往上爬", "衛生紙的顏色水往上爬，塑膠片不會", "兩個都會往上爬", "兩個都不會"], "answer": 1, "hint": "衛生紙有很多細縫會產生毛細現象，塑膠片沒有細縫。"},
        {"lv": 3, "q": "毛細現象裡，縫隙越細，水會怎樣？", "options": ["一定會流掉", "爬得越高", "完全不會爬", "爬得越低"], "answer": 1, "hint": "縫隙越細，毛細現象越明顯，水爬得越高。"},
        {"lv": 3, "q": "電池、電線、燈泡接成電路，中間接上哪一個，燈泡「不會」亮？", "options": ["迴紋針", "鐵湯匙", "銅板", "木頭積木"], "answer": 3, "hint": "木頭是絕緣體，電流不能通過；鐵、銅是導體。"},
        {"lv": 3, "q": "為什麼電線外面要包一層塑膠？", "options": ["讓電線比較漂亮", "讓電流跑得更快", "塑膠是絕緣體，可以避免觸電", "讓電線變重"], "answer": 2, "hint": "裡面的銅線是導體會導電，外面包絕緣的塑膠，人碰到才安全。"},
        {"lv": 3, "q": "把鉛筆的筆芯（石墨）接進電路裡，燈泡會怎樣？", "options": ["不會亮，石墨是絕緣體", "會亮，石墨是導體", "會爆炸", "會變顏色"], "answer": 1, "hint": "石墨雖然不是金屬，但是可以導電，是導體。"}

<style>
:root{
  --bg:#f6f3ea; --surface:#fffdf7; --surface-2:#efe9da; --ink:#23302b; --ink-soft:#5c6a63;
  --line:#ddd5c2; --brand:#2f6f5e; --brand-ink:#ffffff; --accent:#ffb627; --accent-ink:#3a2a00;
  --good:#2e8b57; --good-bg:#e3f4e9; --bad:#c0392b; --bad-bg:#fbe6e2;
  --xp-track:#e4ddca; --shadow:0 2px 0 rgba(35,48,43,.08), 0 8px 24px rgba(35,48,43,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a18; --surface:#1d2522; --surface-2:#26302c; --ink:#eef2ee; --ink-soft:#a5b3ac;
    --line:#33403b; --brand:#5fbfa3; --brand-ink:#0d1714; --accent:#ffc857; --accent-ink:#2a1e00;
    --good:#6fd39b; --good-bg:#1d3427; --bad:#ff8a7a; --bad-bg:#3a2220;
    --xp-track:#2c3833; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1d2522; --surface-2:#26302c; --ink:#eef2ee; --ink-soft:#a5b3ac;
  --line:#33403b; --brand:#5fbfa3; --brand-ink:#0d1714; --accent:#ffc857; --accent-ink:#2a1e00;
  --good:#6fd39b; --good-bg:#1d3427; --bad:#ff8a7a; --bad-bg:#3a2220;
  --xp-track:#2c3833; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.app-name{font-weight:800;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.app-name svg{width:28px;height:28px;flex:none}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:44px;height:44px;padding:0 10px;font-size:14px}
.top-btns{display:flex;gap:6px;flex:none}
.icon-btn.off{opacity:.4;text-decoration:line-through}
.sample-note{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
.warn{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.section-title{font-size:15px;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.section-title small{font-weight:500;color:var(--ink-soft);font-size:13px}

/* 玩家卡 */
.player{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.badge{width:72px;height:72px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.badge .lv-label{font-size:11px;font-weight:700;opacity:.85;letter-spacing:.08em}
.badge .lv-num{font-size:30px;font-weight:900}
.name-row{display:flex;align-items:center;gap:6px;min-width:0}
.name{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edit-name{border:none;background:none;color:var(--ink-soft);font-size:13px;padding:4px 6px;border-radius:8px;text-decoration:underline}
.title-chip{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;margin-top:2px}
.xp{margin-top:14px}
.xp-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:4px}
.xp-track{height:14px;background:var(--xp-track);border-radius:999px;overflow:hidden}
.xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--ink-soft)}

/* 任務 */
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--surface);width:100%;text-align:left;min-height:56px}
.task:last-child{margin-bottom:0}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent;transition:.2s}
.task.done{background:var(--good-bg);border-color:transparent}
.task.done .check{background:var(--good);border-color:var(--good);color:var(--surface)}
.task.done .task-label{text-decoration:line-through;color:var(--ink-soft)}
.task-label{flex:1;min-width:0}
.task-xp{font-size:13px;font-weight:800;color:var(--brand);flex:none}
.all-done{margin-top:10px;text-align:center;font-weight:800;color:var(--good);display:none}

/* 科目卡 */
.skills{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px}
.skills.grid2{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.skill{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px}
.skill-icon{width:44px;height:44px;border-radius:14px;color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.skill-name{font-weight:800}
.skill-sub{font-size:12px;color:var(--ink-soft);line-height:1.3}

/* 傳給爸爸 */
.primary{width:100%;border:none;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:17px;min-height:52px}
.secondary{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;min-height:48px}
.report{width:100%;min-height:170px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);padding:10px;font:inherit;font-size:14px;resize:vertical;margin:10px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px}
.footer button{border:none;background:none;text-decoration:underline;color:var(--ink-soft);font-size:12px;padding:8px}

/* 闖關畫面 */
.quiz{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
.quiz.open{display:block}
.quiz .wrap{padding-top:calc(16px + env(safe-area-inset-top))}
.progress-dots{display:flex;gap:6px;margin:4px 0 14px}
.dot{flex:1;height:8px;border-radius:999px;background:var(--xp-track)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.now{background:var(--accent)}
.q-text{font-size:20px;font-weight:800;line-height:1.5;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:18px;min-height:54px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:12px 14px;margin:6px 0 14px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-bg);color:var(--good)}
.feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback p{margin:2px 0;color:var(--ink)}
.result-big{font-size:44px;font-weight:900;text-align:center;margin:20px 0 4px}
.result-sub{text-align:center;color:var(--ink-soft);margin-bottom:12px}
.result-badge{text-align:center;font-weight:800;border-radius:14px;padding:10px 12px;margin:0 0 16px}
.result-badge.ok{background:var(--good-bg);color:var(--good)}
.result-badge.no{background:var(--surface-2);color:var(--ink)}
.stack>*{margin-bottom:10px}

/* 選關卡 */
.stage-intro{margin:0 0 12px;color:var(--ink-soft);font-size:14px}
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:10px;min-height:76px}
.stage.locked{opacity:.55}
.stage-num{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff}
.stage-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.stage-info b{font-size:17px}
.stage-info span{font-size:13px;color:var(--ink-soft)}
.stage-info .stage-rec{color:var(--ink);font-weight:700}
.qtimer{font-weight:900;font-variant-numeric:tabular-nums;font-size:17px;padding:6px 12px;border-radius:999px;background:var(--surface-2);flex:none}
.qtimer.low{background:var(--bad-bg);color:var(--bad)}
.quiz .app-name{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}

/* 提示訊息與升級 */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.levelup{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,15,13,.55);padding:16px}
.levelup.show{display:flex}
.levelup-box{background:var(--surface);border-radius:24px;padding:24px 20px;text-align:center;max-width:340px;width:100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.levelup-box .star{width:84px;height:84px;margin:0 auto 6px}
.levelup-box h2{margin:0;font-size:26px}
.levelup-box p{margin:6px 0 18px;color:var(--ink-soft)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.float-xp{position:fixed;font-weight:900;color:var(--brand);pointer-events:none;z-index:45;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
.primary:disabled{opacity:.45;cursor:not-allowed}

/* 今日獎勵卡 */
.reward-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.reward-gift{width:56px;height:56px;flex:none}
.reward-row b{font-size:18px;display:block;line-height:1.3}
.reward-row span{font-size:13px;color:var(--ink-soft)}
.reward-card.ready{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.reward-card.ready .primary{background:var(--accent);color:var(--accent-ink);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.timer{text-align:center;margin-top:4px}
.timer-num{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.2}
.timer-sub{font-size:13px;color:var(--ink-soft);margin-bottom:10px}

/* 領獎儀式 */
.ceremony{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 42%, #2b5a4c 0%, #10201b 70%)}
.ceremony.show{display:flex}
.cer-stage{position:relative;width:100%;max-width:340px;text-align:center;color:#fff}
.rays{position:absolute;left:50%;top:120px;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;
  background:repeating-conic-gradient(rgba(255,214,102,.28) 0 10deg, transparent 10deg 24deg);pointer-events:none}
.ceremony.open .rays{animation:raysIn .6s ease-out forwards, spin 14s linear infinite}
@keyframes raysIn{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.gift{position:relative;width:180px;height:200px;margin:0 auto}
.gift svg{position:absolute;left:0;width:180px;overflow:visible}
.gift .box{top:80px;height:120px}
.gift .lid{top:44px;height:56px;transform-origin:50% 100%}
.ceremony.shake .gift{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-8deg)}60%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}}
.ceremony.open .gift .lid{animation:lidOff .7s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes lidOff{to{transform:translate(70px,-150px) rotate(38deg);opacity:0}}
.ticket{position:absolute;left:50%;top:110px;transform:translate(-50%,0) scale(.3);opacity:0;z-index:2;
  background:#fff8e1;color:#4a3300;border-radius:16px;padding:14px 22px;font-weight:900;font-size:24px;white-space:nowrap;
  box-shadow:0 10px 30px rgba(0,0,0,.35);border:3px dashed #ffb627}
.ticket small{display:block;font-size:12px;font-weight:700;letter-spacing:.15em;color:#a06b00}
.ceremony.open .ticket{animation:ticketUp .8s .25s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes ticketUp{to{transform:translate(-50%,-110px) scale(1);opacity:1}}
.cer-text{opacity:0;transform:translateY(12px);margin-top:8px}
.ceremony.open .cer-text{animation:fadeUp .5s 1s ease-out forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
.cer-text h2{margin:0;font-size:26px}
.cer-text p{margin:6px 0 18px;color:#d6e8e1}
.cer-text .primary{background:#ffb627;color:#3a2a00}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;opacity:.95;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}
  .ceremony.open .ticket{transform:translate(-50%,-110px) scale(1);opacity:1}
  .ceremony.open .cer-text,.ceremony.open .rays{opacity:1;transform:none}
  .ceremony.open .gift .lid{opacity:0}}
</style>
</head>
<body>
<main class="wrap" id="home">
  <div class="topbar">
    <div class="app-name">
      <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#2f6f5e"/><path d="M256 110 L292 210 L398 214 L314 278 L344 380 L256 320 L168 380 L198 278 L114 214 L220 210 Z" fill="#ffd166"/></svg>
      <span id="appName">今天也升一級</span>
    </div>
    <div class="top-btns">
      <button class="icon-btn" id="musicBtn" data-nosfx aria-label="背景音樂開關" aria-pressed="true">🎵</button>
      <button class="icon-btn" id="sfxBtn" data-nosfx aria-label="按鍵音效開關" aria-pressed="true">🔊</button>
      <button class="icon-btn" id="themeBtn" aria-label="切換深淺色">🌓</button>
    </div>
  </div>

  <div class="warn" id="storageWarn" hidden>這支手機現在存不了進度（可能是無痕模式），關掉網頁後進度會不見。</div>
  <div class="sample-note" id="sampleNote" hidden></div>

  <!-- 玩家卡 -->
  <section class="card" aria-label="我的等級">
    <div class="player">
      <div class="badge"><span class="lv-label">LEVEL</span><span class="lv-num" id="lvNum">1</span></div>
      <div style="min-width:0">
        <div class="name-row"><span class="name" id="playerName">小勇者</span><button class="edit-name" id="editName">改名字</button></div>
        <span class="title-chip" id="titleChip">剛發芽的小種子</span>
      </div>
    </div>
    <div class="xp">
      <div class="xp-meta"><span>經驗值</span><span id="xpText">0 / 100</span></div>
      <div class="xp-track" role="progressbar" aria-label="經驗值" aria-valuemin="0" aria-valuemax="100" id="xpBar"><div class="xp-fill" id="xpFill"></div></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="streak">0</b><span>連續天數</span></div>
      <div class="stat"><b id="todayXp">0</b><span>今天得到 XP</span></div>
      <div class="stat"><b id="totalXp">0</b><span>總經驗值</span></div>
    </div>
  </section>

  <!-- 今日任務 -->
  <section class="card" aria-label="今日任務">
    <h2 class="section-title">今日任務 <small id="taskCount">0 / 3</small></h2>
    <div id="taskList"></div>
    <div class="all-done" id="allDone">今天的任務全部完成，太厲害了！</div>
  </section>

  <!-- 今日獎勵 -->
  <section class="card reward-card" id="rewardCard" aria-label="今日獎勵">
    <h2 class="section-title">今日獎勵 <small id="rewardState">任務全部完成就能領</small></h2>
    <div class="reward-row">
      <svg class="reward-gift" viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="40" width="76" height="52" rx="8" fill="#d1495b"/><rect x="6" y="26" width="88" height="20" rx="6" fill="#e86a7a"/><rect x="44" y="26" width="12" height="66" fill="#ffd166"/><path d="M50 26 C36 8 20 16 30 26 Z M50 26 C64 8 80 16 70 26 Z" fill="#ffd166"/></svg>
      <div><b id="rewardLabel">玩遊戲 10 分鐘</b><span id="rewardHint">還差 3 個任務</span></div>
    </div>
    <button class="primary" id="rewardBtn" disabled>🔒 完成任務才能領</button>
    <div class="timer" id="timerBox" hidden>
      <div class="timer-num" id="timerNum">10:00</div>
      <div class="timer-sub" id="timerSub">準備好就按開始</div>
      <button class="primary" id="timerBtn">開始計時</button>
    </div>
  </section>

  <!-- 科目技能卡 -->
  <section class="card" aria-label="科目闖關">
    <h2 class="section-title">科目闖關 <small>點一科開始</small></h2>
    <div class="skills" id="skillList"></div>
  </section>

  <!-- 傳給爸爸 -->
  <section class="card" aria-label="傳給爸爸">
    <h2 class="section-title" id="sendTitle">傳給爸爸</h2>
    <button class="primary" id="makeReport">整理今天的進度</button>
    <div id="reportArea" hidden>
      <textarea class="report" id="reportText" readonly aria-label="今天的進度文字"></textarea>
      <div class="row">
        <button class="primary" id="copyBtn">複製文字</button>
        <button class="secondary" id="shareBtn" hidden>分享到 Line…</button>
      </div>
      <p class="footer" style="margin-top:10px">複製後打開 Line，貼到跟爸爸的聊天室就好。</p>
    </div>
  </section>

  <div class="footer">進度只存在這支手機裡 <button id="resetBtn">清除全部進度</button></div>
</main>

<!-- 闖關畫面 -->
<section class="quiz" id="quiz" aria-modal="true" role="dialog" aria-label="闖關答題">
  <div class="wrap">
    <div class="topbar">
      <div class="app-name" id="quizTitle">數學闖關</div>
      <span class="qtimer" id="qTimer" hidden aria-live="off">⏱ 0:00</span>
      <button class="icon-btn" id="quizClose">離開</button>
    </div>
    <div class="progress-dots" id="dots"></div>
    <div id="quizBody"></div>
  </div>
</section>

<div class="ceremony" id="ceremony" role="dialog" aria-label="領取獎勵">
  <div class="cer-stage">
    <div class="rays"></div>
    <div class="gift">
      <div class="ticket" id="cerTicket"><small>獎勵券</small><span id="cerTicketText">🎮 玩遊戲 10 分鐘</span></div>
      <svg class="box" viewBox="0 0 180 120" aria-hidden="true"><rect x="10" y="0" width="160" height="120" rx="12" fill="#d1495b"/><rect x="10" y="0" width="160" height="16" fill="#b33a4b"/><rect x="78" y="0" width="24" height="120" fill="#ffd166"/></svg>
      <svg class="lid" viewBox="0 0 180 56" aria-hidden="true"><path d="M90 20 C64 -12 34 2 54 20 Z M90 20 C116 -12 146 2 126 20 Z" fill="#ffd166"/><rect x="0" y="18" width="180" height="38" rx="10" fill="#e86a7a"/><rect x="78" y="18" width="24" height="38" fill="#ffd166"/></svg>
    </div>
    <div class="cer-text">
      <h2 id="cerTitle">恭喜你！</h2>
      <p id="cerSub">今天的任務全部完成，換到獎勵了</p>
      <button class="primary" id="cerOk">收下獎勵</button>
    </div>
  </div>
</div>

<div class="levelup" id="levelup" role="dialog" aria-label="升級了">
  <div class="levelup-box">
    <svg class="star" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 40 L310 190 L470 196 L344 292 L390 448 L256 358 L122 448 L168 292 L42 196 L202 190 Z" fill="#ffb627"/></svg>
    <h2 id="luTitle">升到 Lv.2！</h2>
    <p id="luSub">新稱號：會思考的小樹苗</p>
    <button class="primary" id="luOk">太棒了，繼續！</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  // ---------- 讀設定 ----------
  var CFG;
  try { CFG = JSON.parse(document.getElementById("config").textContent); }
  catch(e){ CFG = {appName:"今天也升一級",defaultName:"小勇者",parentName:"爸爸",xpPerLevel:100,xpPerCorrect:10,titles:[{level:1,title:"小種子"}],tasks:[],subjects:[]}; }
  var KEY = CFG.storageKey || "levelup-kid-v1"; // 每個孩子的檔案用不同名字，進度才不會混在一起
  function quizList(t){ return !t.quiz ? [] : (Array.isArray(t.quiz) ? t.quiz : [t.quiz]); }
  var $ = function(id){ return document.getElementById(id); };

  // ---------- 存讀進度（讀不到也照常運作） ----------
  var canStore = true;
  function load(){
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ canStore = false; return null; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ canStore = false; $("storageWarn").hidden = false; }
  }
  function today(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function yesterday(){ var d = new Date(); d.setDate(d.getDate()-1); return today(d); }

  var S = load() || {};
  S.unlock = S.unlock || {};   // 每科開到第幾關（不會每天重來）
  S.best = S.best || {};       // 每科每關的最佳紀錄
  S.name = S.name || CFG.defaultName;
  S.xp = S.xp || 0;
  S.streak = S.streak || 0;
  S.lastActive = S.lastActive || "";
  S.theme = S.theme || "";
  if (!S.day || S.day.date !== today()) {
    S.day = { date: today(), tasks: {}, xp: 0, answered: {}, quiz: {} };
  }
  // 連續天數：昨天之前就斷了，畫面顯示 0（今天第一次得分再接上）
  if (S.lastActive && S.lastActive !== today() && S.lastActive !== yesterday()) { S.streak = 0; }
  if (!canStore) $("storageWarn").hidden = false;

  // ---------- 等級計算 ----------
  function levelOf(xp){ return Math.floor(xp / CFG.xpPerLevel) + 1; }
  function titleOf(lv){
    var t = CFG.titles[0] ? CFG.titles[0].title : "";
    CFG.titles.forEach(function(x){ if (lv >= x.level) t = x.title; });
    return t;
  }

  function addXp(n, fromEl){
    var before = levelOf(S.xp);
    S.xp += n; S.day.xp += n;
    if (S.lastActive !== today()) {
      S.streak = (S.lastActive === yesterday()) ? S.streak + 1 : 1;
      S.lastActive = today();
    }
    save(); render();
    if (fromEl) floatXp(fromEl, n);
    var after = levelOf(S.xp);
    if (after > before) showLevelUp(after);
  }

  // ---------- 畫面 ----------
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function render(){
    $("appName").textContent = CFG.appName;
    document.title = CFG.appName;
    $("sampleNote").textContent = CFG.note || "";
    $("sampleNote").hidden = !CFG.note;
    $("sendTitle").textContent = "傳給" + CFG.parentName;
    var lv = levelOf(S.xp), inLv = S.xp % CFG.xpPerLevel;
    $("playerName").textContent = S.name;
    $("lvNum").textContent = lv;
    $("titleChip").textContent = titleOf(lv);
    $("xpText").textContent = inLv + " / " + CFG.xpPerLevel;
    $("xpFill").style.width = (inLv / CFG.xpPerLevel * 100) + "%";
    $("xpBar").setAttribute("aria-valuenow", inLv);
    $("streak").textContent = S.streak;
    $("todayXp").textContent = S.day.xp;
    $("totalXp").textContent = S.xp;

    var done = 0;
    $("taskList").innerHTML = CFG.tasks.map(function(t){
      var d = !!S.day.tasks[t.id]; if (d) done++;
      return '<button class="task'+(d?' done':'')+'" data-task="'+esc(t.id)+'" aria-pressed="'+d+'">'+
        '<span class="check">✓</span><span class="task-label">'+esc(t.label)+'</span>'+
        '<span class="task-xp">'+(d?'已完成':'+'+t.xp+' XP')+'</span></button>';
    }).join("");
    $("taskCount").textContent = done + " / " + CFG.tasks.length;
    $("allDone").style.display = (CFG.tasks.length && done === CFG.tasks.length) ? "block" : "none";

    $("skillList").innerHTML = CFG.subjects.map(function(s){
      var n = stagesOf(s).length, un = Math.min(unlocked(s), n), tb = todayTop(s);
      var sub = "開到第 " + un + " / " + n + " 關" + (tb ? "<br>今天第 " + tb.lv + " 關 " + tb.r.right + "/" + tb.r.total : "");
      return '<button class="skill" data-subject="'+esc(s.id)+'">'+
        '<span class="skill-icon" style="background:'+esc(s.color)+'">'+esc(s.icon)+'</span>'+
        '<span class="skill-name">'+esc(s.name)+'</span><span class="skill-sub">'+sub+'</span></button>';
    }).join("");
    $("skillList").classList.toggle("grid2", CFG.subjects.length > 3);
    renderReward(done);
  }

  // ---------- 今日獎勵（任務全完成才能領，一天一次） ----------
  var RW = CFG.reward || null;
  function rewardState(){ S.day.reward = S.day.reward || { redeemed: false, timerEnd: 0, timerDone: false }; return S.day.reward; }
  function renderReward(done){
    $("rewardCard").hidden = !RW;
    if (!RW) return;
    var r = rewardState(), left = CFG.tasks.length - done, ready = left <= 0;
    $("rewardLabel").textContent = (RW.icon ? RW.icon + " " : "") + RW.label;
    $("rewardCard").classList.toggle("ready", ready && !r.redeemed);
    if (r.redeemed) {
      $("rewardState").textContent = "今天已經領過了";
      $("rewardHint").textContent = "明天完成任務可以再領一次";
      $("rewardBtn").hidden = true;
      $("timerBox").hidden = !RW.minutes;
      drawTimer();
    } else {
      $("rewardBtn").hidden = false;
      $("timerBox").hidden = true;
      $("rewardBtn").disabled = !ready;
      $("rewardBtn").textContent = ready ? "🎁 領取今天的獎勵" : "🔒 完成任務才能領";
      $("rewardState").textContent = ready ? "可以領了！" : "任務全部完成就能領";
      $("rewardHint").textContent = ready ? "你今天好認真，打開禮物吧" : "還差 " + left + " 個任務";
    }
  }

  // 音樂：用手機內建的發聲功能即時演奏，不需要音樂檔
  var AC = null;
  function audio(){
    if (RW && RW.sound === false) return null;
    return ac0();
  }
  function ac0(){
    try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; }
    catch(e){ return null; }
  }
  function note(ac, freq, start, dur, type, vol){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(ac.destination); o.start(start); o.stop(start + dur + 0.05);
  }
  function playDrumroll(){
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    for (var i = 0; i < 14; i++) note(ac, 180 + i * 12, t + i * 0.062, 0.05, "square", 0.05 + i * 0.006);
  }
  function playFanfare(){
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + 0.02;
    // 上行琶音 → 長和弦 → 亮晶晶的高音
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ note(ac, f, t + i * 0.11, 0.22, "triangle", 0.22); });
    [523.25, 659.25, 783.99, 1046.5].forEach(function(f){ note(ac, f, t + 0.5, 1.2, "triangle", 0.12); });
    note(ac, 261.63, t + 0.5, 1.2, "sine", 0.18);
    [1568, 2093, 1760, 2349, 2637].forEach(function(f, i){ note(ac, f, t + 0.6 + i * 0.09, 0.18, "sine", 0.06); });
  }
  function playTimeUp(){
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime + 0.02;
    [0, 0.35, 0.7].forEach(function(d){ note(ac, 880, t + d, 0.18, "sine", 0.25); note(ac, 659.25, t + d + 0.16, 0.18, "sine", 0.2); });
  }

  function confetti(){
    var colors = ["#ffd166", "#d1495b", "#5fbfa3", "#3d8bfd", "#ffffff", "#ff9f1c"];
    var box = $("ceremony");
    for (var i = 0; i < 70; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "%";
      c.style.background = colors[i % colors.length];
      c.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      c.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      c.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
      c.style.animationDelay = (Math.random() * 0.5) + "s";
      box.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); }, 4200); })(c);
    }
  }

  var cerTimers = [];
  function startCeremony(){
    var cer = $("ceremony");
    cerTimers.forEach(clearTimeout); cerTimers = [];
    $("cerTicketText").textContent = (RW.icon ? RW.icon + " " : "") + RW.label;
    $("cerTitle").textContent = "恭喜 " + S.name + "！";
    cer.className = "ceremony show shake";
    document.body.style.overflow = "hidden";
    bgmSync(); // 背景音樂先停，讓位給領獎音樂
    playDrumroll();
    cerTimers.push(setTimeout(function(){
      cer.className = "ceremony show open";
      playFanfare(); confetti();
      if (navigator.vibrate) { try { navigator.vibrate([60, 40, 120]); } catch(e){} }
    }, 900));
    cerTimers.push(setTimeout(function(){ $("cerOk").focus({preventScroll:true}); }, 1500));
  }
  function endCeremony(){
    cerTimers.forEach(clearTimeout); cerTimers = [];
    $("ceremony").className = "ceremony";
    document.body.style.overflow = "";
    render(); bgmSync();
    toast("獎勵收好了！要開始時按「開始計時」");
  }
  $("rewardBtn").addEventListener("click", function(){
    var r = rewardState();
    var allDone = CFG.tasks.every(function(t){ return S.day.tasks[t.id]; });
    if (!allDone || r.redeemed) return;
    r.redeemed = true; save();
    startCeremony();
  });
  $("cerOk").addEventListener("click", endCeremony);

  // 獎勵計時器：記住結束時間，重新整理或切到別的 App 回來也算得準
  var tick = null;
  function fmt(sec){ sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
  function drawTimer(){
    if (!RW || !RW.minutes) return;
    var r = rewardState(), now = Date.now();
    clearInterval(tick); tick = null;
    if (r.timerDone) {
      $("timerNum").textContent = "0:00";
      $("timerSub").textContent = "時間到囉！今天的獎勵用完了";
      $("timerBtn").hidden = true;
    } else if (r.timerEnd && r.timerEnd > now) {
      $("timerNum").textContent = fmt((r.timerEnd - now) / 1000);
      $("timerSub").textContent = "好好玩！時間到會響鈴";
      $("timerBtn").hidden = false; $("timerBtn").textContent = "提早結束";
      tick = setInterval(function(){
        var rest = (r.timerEnd - Date.now()) / 1000;
        if (rest <= 0) { r.timerDone = true; save(); playTimeUp(); toast("時間到囉！"); drawTimer(); return; }
        $("timerNum").textContent = fmt(rest);
      }, 250);
    } else if (r.timerEnd && r.timerEnd <= now) {
      r.timerDone = true; save(); drawTimer();
    } else {
      $("timerNum").textContent = fmt(RW.minutes * 60);
      $("timerSub").textContent = "準備好就按開始";
      $("timerBtn").hidden = false; $("timerBtn").textContent = "開始計時";
    }
  }
  $("timerBtn").addEventListener("click", function(){
    var r = rewardState();
    if (r.timerEnd && r.timerEnd > Date.now()) {

  // ---------- 背景音樂與音效（手機即時發聲，不用音檔、不用網路） ----------
  if (S.music == null) S.music = true;
  if (S.sfx == null) S.sfx = true;
  var soundReady = false; // 手機規定：孩子先點一下畫面，才可以出聲音
  function tone(ac, freq, start, dur, type, vol, dest){
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest || ac.destination); o.start(start); o.stop(start + dur + 0.05);

  function seq(ac, t, freqs, gap, dur, type, vol){ freqs.forEach(function(f, i){ tone(ac, f, t + i * gap, dur, type, vol); }); }
  var SFX = {
    tap:     function(ac, t){ tone(ac, 900, t, 0.05, "sine", 0.05); },
    correct: function(ac, t){ tone(ac, 1046.5, t, 0.1, "triangle", 0.08); tone(ac, 1568, t + 0.09, 0.22, "triangle", 0.08); },
    wrong:   function(ac, t){ tone(ac, 247, t, 0.14, "triangle", 0.06); tone(ac, 185, t + 0.14, 0.3, "triangle", 0.06); },
    coin:    function(ac, t){ tone(ac, 988, t, 0.08, "triangle", 0.07); tone(ac, 1319, t + 0.08, 0.3, "triangle", 0.07); },
    locked:  function(ac, t){ tone(ac, 140, t, 0.18, "triangle", 0.2); tone(ac, 120, t + 0.12, 0.2, "triangle", 0.18); },
    start:   function(ac, t){ seq(ac, t, [659, 784, 1047], 0.08, 0.12, "triangle", 0.07); },
    tick:    function(ac, t){ tone(ac, 1100, t, 0.04, "sine", 0.07); },
    timeUp:  function(ac, t){ seq(ac, t, [523, 392, 262], 0.18, 0.2, "triangle", 0.08); },
    clear:   function(ac, t){ seq(ac, t, [523, 659, 784, 1047], 0.1, 0.15, "triangle", 0.07); [523, 659, 784, 1047].forEach(function(f){ tone(ac, f, t + 0.45, 0.7, "triangle", 0.07); }); },
    unlock:  function(ac, t){ SFX.clear(ac, t); seq(ac, t + 0.9, [1319, 1568, 2093, 2637, 3136], 0.06, 0.15, "sine", 0.05); },
    fail:    function(ac, t){ seq(ac, t, [392, 349, 330, 294], 0.16, 0.2, "triangle", 0.12); },
    levelUp: function(ac, t){ seq(ac, t, [392, 523, 659, 784], 0.09, 0.12, "triangle", 0.07); tone(ac, 1047, t + 0.38, 0.6, "triangle", 0.07); tone(ac, 523, t + 0.38, 0.6, "triangle", 0.1); }
  };
  function sfx(name){
    if (!S.sfx || !soundReady || !SFX[name]) return;
    var ac = ac0(); if (!ac) return;
    SFX[name](ac, ac.currentTime + 0.01);
  }

  // 背景音樂：首頁輕快、闖關緊張；剩 30 秒會變快。旋律用和弦音自動排出來，一直循環
  function midi(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  var C = [60, 64, 67], G = [55, 59, 62], Am = [57, 60, 64], F = [53, 57, 60], Em = [52, 55, 59];
  var SONGS = {
    home: { bpm: 92, chords: [C, G, Am, F, C, Em, F, G],
            pats: [[0, -1, 1, -1, 2, -1, 1, -1], [3, -1, 2, -1, 1, -1, -1, -1]] },
    quiz: { bpm: 112, chords: [Am, F, C, G],
            pats: [[0, -1, 2, -1, 1, -1, 2, -1], [3, -1, 2, -1, 0, -1, -1, -1]] }
  };
  var BGM = { song: null, step: 0, next: 0, timer: null, gain: null, fast: false };
  function bgmWant(){
    if (!S.music || !soundReady || document.hidden) return null;
    if ($("ceremony").classList.contains("show")) return null; // 領獎時讓位給號角
    return (Q && Q.st && !Q.finished) ? "quiz" : "home";
  }
  function bgmSync(){
    var want = bgmWant();
    if (want === BGM.song) return;
    bgmStop();
    if (!want) return;
    var ac = ac0(); if (!ac) return;
    BGM.song = want; BGM.step = 0; BGM.next = ac.currentTime + 0.15;

  }
  function bgmTick(){
    var ac = AC, song = SONGS[BGM.song]; if (!ac || !song || !BGM.gain) return;
    var step = 60 / (song.bpm * (BGM.fast ? 1.15 : 1)) / 2; // 八分音符
    if (BGM.next < ac.currentTime) BGM.next = ac.currentTime + 0.05; // 卡頓後不要一次補一堆音
    while (BGM.next < ac.currentTime + 0.25) {
      var bar = Math.floor(BGM.step / 8) % song.chords.length, pos = BGM.step % 8;
      var ch = song.chords[bar], p = song.pats[bar % song.pats.length][pos];
      var tones = [ch[0] + 12, ch[1] + 12, ch[2] + 12, ch[0] + 24];

  }
  function unlockSound(){
    if (soundReady) return;

  }
  document.addEventListener("pointerdown", unlockSound, true);
  document.addEventListener("keydown", unlockSound, true);
  document.addEventListener("visibilitychange", bgmSync);
  // 按任何按鈕都有「嗶」一聲（答題選項有自己的對錯音效）
  document.addEventListener("click", function(e){

  }

  $("sfxBtn").addEventListener("click", function(){

  // ---------- 今日任務 ----------

  // ---------- 闖關：選關卡 → 限時答題 → 看結果 ----------
  var DEFAULT_STAGES = [{ lv: 1, name: "第 1 關", perRound: 10, seconds: 150, pass: 8 }];
  function subjectById(id){ return CFG.subjects.filter(function(x){ return x.id === id; })[0]; }

      stagesOf(s).map(function(st){

  function startStage(s, lv){

  // 倒數計時：看答案和提示的時候會暫停，按「下一題」才繼續
  function timeLeft(){ return Q.remain - (Q.runStart ? Date.now() - Q.runStart : 0); }

  function floatXp(el, n){

    f.style.left = Math.min(r.left + r.width/2 - 24, window.innerWidth - 80) + "px";
    f.style.top = (r.top - 4) + "px";
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, 950);
  }

  // ---------- 改名字 ----------
  $("editName").addEventListener("click", function(){
    var n = window.prompt("你的名字或暱稱是？", S.name);
    if (n === null) return;
    n = n.trim().slice(0, 12);
    if (n) { S.name = n; save(); render(); }
  });

  // ---------- 傳給爸爸 ----------
  function buildReport(){
    var lines = [];
    var d = new Date();
    lines.push("📘 " + S.name + " 的學習回報（" + (d.getMonth()+1) + "/" + d.getDate() + "）");
    lines.push("等級 Lv." + levelOf(S.xp) + "｜" + titleOf(levelOf(S.xp)));
    lines.push("今天得到 " + S.day.xp + " XP，總共 " + S.xp + " XP，連續 " + S.streak + " 天");
    lines.push("");
    lines.push("✅ 今日任務");
    CFG.tasks.forEach(function(t){ lines.push((S.day.tasks[t.id] ? "☑ " : "☐ ") + t.label); });
    if (RW) {
      var rr = rewardState();
      lines.push("");
      lines.push("🎁 今日獎勵（" + RW.label + "）：" + (rr.timerDone ? "已領取，時間用完了" : rr.timerEnd ? "已領取，計時中" : rr.redeemed ? "已領取，還沒開始用" : "還沒領"));
    }
    lines.push("");
    lines.push("🎯 闖關成績");
    var any = false;
    CFG.subjects.forEach(function(s){
      var d = todayQuiz(s); if (!d) return;
      Object.keys(d).sort().forEach(function(k){
        var r = d[k], st = stageOf(s, +k); any = true;
        lines.push(s.name + " 第 " + k + " 關：" + r.right + "/" + r.total + " 題答對，用時 " + fmt(r.sec) + (st && r.right >= st.pass ? " ✅過關" : ""));
      });
    });
    if (!any) lines.push("今天還沒闖關");
    lines.push("🗺️ 目前開到：" + CFG.subjects.map(function(s){ return s.name + "第 " + Math.min(unlocked(s), stagesOf(s).length) + " 關"; }).join("、"));
    return lines.join("\n");
  }
  $("makeReport").addEventListener("click", function(){
    $("reportText").value = buildReport();
    $("reportArea").hidden = false;
    $("shareBtn").hidden = !navigator.share;
  });
  $("copyBtn").addEventListener("click", function(){
    var text = $("reportText").value;
    function fallback(){
      var ta = $("reportText"); ta.removeAttribute("readonly"); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
      ta.setAttribute("readonly", ""); window.getSelection().removeAllRanges();
      toast(ok ? "複製好了，去 Line 貼上吧！" : "請長按文字框，選「全選」再「複製」");
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ toast("複製好了，去 Line 貼上吧！"); }, fallback);
    } else fallback();
  });
  $("shareBtn").addEventListener("click", function(){
    navigator.share({ text: $("reportText").value }).catch(function(){});
  });

  // ---------- 深淺色 ----------
  function applyTheme(){
    if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  $("themeBtn").addEventListener("click", function(){
    var dark = S.theme ? S.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    S.theme = dark ? "light" : "dark"; save(); applyTheme();
    toast(dark ? "切換成淺色" : "切換成深色");
  });

  // ---------- 清除 ----------
  $("resetBtn").addEventListener("click", function(){
    if (!window.confirm("確定要清除全部進度嗎？等級和經驗值會回到 0。")) return;
    try { localStorage.removeItem(KEY); } catch(e){}
    S = { name: CFG.defaultName, xp: 0, streak: 0, lastActive: "", theme: S.theme, music: S.music, sfx: S.sfx, unlock: {}, best: {}, day: { date: today(), tasks: {}, xp: 0, answered: {}, quiz: {} } };
    save(); render(); toast("已經重新開始");
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") {
      if ($("ceremony").classList.contains("show")) endCeremony();
      else if ($("levelup").classList.contains("show")) $("levelup").classList.remove("show");
      else if (Q) closeQuiz();
    }
  });

  applyTheme();
  render();
  drawSoundBtns();
})();
</script>
</body>
</html>
